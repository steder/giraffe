[project]
name = "giraffe"
version = "0.2.0"
description = "Just imagemagick on ec2"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Mike Steder", email = "steder@gmail.com" },
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.116.1",
    "uvicorn[standard]>=0.35.0",
    "pillow>=12.0.0",
    "tinys3>=0.1.12",
    "wand>=0.7.0",
    "requests>=2.32.4",
    "jinja2>=3.1.6",
]

[dependency-groups]
dev = [
    "pytest>=9.0.1",
    "pytest-asyncio>=1.0.0",
    "httpx>=0.28.1",
    "flake8>=7.3.0",
]

[tool.uv]
package = false
